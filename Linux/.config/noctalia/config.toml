[plugin_settings."noctalia/mpvpaper"]
video_directory = "/home/notkirilov/Pictures/Wallpapers"

[plugin_settings."noctalia/screen_recorder"]
video_source = "region"

[plugins]
enabled = [
    "0rgl/ask-claude",
    "felipeartur/ai-usagebar",
    "noctalia/notes",
    "noctalia/bitwarden",
    "noctalia/screen_recorder",
    "noctalia/mpvpaper"
]

[shell]
font_family = "JetBrainsMono NF"

    [shell.window_switcher]
    mru = true

[theme]
builtin = "Noctalia"
community_palette = "Mizuki-Akiyama"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "vibrant"

    [theme.templates]
    builtin_ids = [ "btop", "cava", "gtk3", "gtk4", "hyprland", "kcolorscheme", "kitty", "qt" ]

[wallpaper.default]
path = "/home/notkirilov/Pictures/Wallpapers/beach-landscape-twilight-sunset.jpg"

[wallpaper.last]
path = "/home/notkirilov/Pictures/Wallpapers/beach-landscape-twilight-sunset.jpg"

[wallpaper.monitors.DP-1]
path = "/home/notkirilov/Pictures/Wallpapers/beach-landscape-twilight-sunset.jpg"

[wallpaper.monitors.eDP-1]
path = "/home/notkirilov/Pictures/Wallpapers/beach-landscape-twilight-sunset.jpg"

[[wallpaper.favorite]]
palette_source = "wallpaper"
path = "/home/notkirilov/Pictures/Wallpapers/RanchoTwilight_T_Mac.jpg"
theme_mode = "dark"
wallpaper_scheme = "vibrant"

[[wallpaper.favorite]]
palette_source = "wallpaper"
path = "/home/notkirilov/Pictures/Wallpapers/beach-landscape-twilight-sunset.jpg"
theme_mode = "dark"
wallpaper_scheme = "vibrant"

[widget.bar]
type = "felipeartur/ai-usagebar:bar"

[widget.claude-panel]
glyph = "sparkles"
tooltip = "Claude Code (SUPER+A)"
type = "custom_button"

    [widget.claude-panel.actions]
    left = "exec ~/.config/hypr/scripts/claude-panel.sh"

[widget.mpvpaper]
type = "noctalia/mpvpaper:mpvpaper"

[widget.notes]
type = "noctalia/notes:notes"

[widget.recorder]
type = "noctalia/screen_recorder:recorder"
