[plugin_settings."fel/quill"]
git_history = false
notes_dir = "/home/notkirilov/obsidian-storage/publish/Quick Notes"

[plugin_settings."noctalia/mpvpaper"]
video_directory = "/home/notkirilov/Pictures/Wallpapers"

[plugin_settings."noctalia/screen_recorder"]
video_source = "region"

[plugin_settings."noctalia/translator"]
provider = "google"
target_lang = "ru"

[plugin_settings."notkirilov/claude-agent"]
model = "default"
send_on_enter = true

[plugin_settings."notkirilov/system-ai-agent"]
send_on_enter = true
suggestion_accept = "enter"
suggestion_next = "tab"
suggestion_previous = "shift_tab"

[plugin_settings."vn1k/cursor"]
hyprland_config = "/home/notkirilov/.config/hypr/cursor-plugin/hyprland.conf"

[plugins]
enabled = [
    "0rgl/ask-claude",
    "noctalia/bitwarden",
    "noctalia/screen_recorder",
    "noctalia/mpvpaper",
    "vn1k/cursor",
    "fel/quill",
    "remo/noctes",
    "noctalia/translator",
    "icefish/phone-connect",
    "kenn/keybind-cheatsheet",
    "nilsonlinux/speedtest-meter",
    "thaer99ob/default-apps",
    "pvs/ai-usage",
    "notkirilov/system-ai-agent",
    "pvs/kanban"
]

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    name = "official"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    name = "community"

    [[plugins.source]]
    kind = "path"
    location = "/home/notkirilov/Desktop/balovstvo/system-ai-agent"
    name = "system-ai-agent-dev"

    [[plugins.source]]
    kind = "path"
    location = "/home/notkirilov/Desktop/balovstvo/neo-ai-uasge"
    name = "ai-usage-dev"

    [[plugins.source]]
    kind = "path"
    location = "/home/notkirilov/Desktop/balovstvo/kanban-noctalia-plugin"
    name = "kanban-dev"

[shell]
app_icon_colorize = true
font_family = "JetBrainsMono NF"

    [shell.launcher.dmenu.entry.panels]
    command = "grep -v '^#' ~/.config/noctalia/panels.tsv | cut -f1,2"
    exec = "~/.config/hypr/scripts/open-panel.sh '{selection}'"
    global = true
    glyph = "layout-sidebar-right"
    label = "Панели"
    prefix = "p"

    [shell.window_switcher]
    mru = true

[theme]
builtin = "Noctalia"
community_palette = "Cyberpunk"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "vibrant"

    [theme.templates]
    builtin_ids = [ "btop", "cava", "gtk3", "gtk4", "hyprland", "kcolorscheme", "kitty", "qt" ]

[wallpaper]
directory = "/home/notkirilov/Pictures/Wallpapers"

    [wallpaper.default]
    path = "/home/notkirilov/Pictures/Wallpapers/hyprland-anime-blue-4k.png"

    [wallpaper.last]
    path = "/home/notkirilov/Pictures/Wallpapers/hyprland-anime-blue-4k.png"

    [wallpaper.monitors.DP-1]
    path = "/home/notkirilov/Pictures/Wallpapers/lake-mountains-rocks-twilight-sunset-starry-sky-purple-sky.jpg"

    [wallpaper.monitors.DP-7]
    path = "/home/notkirilov/Pictures/Wallpapers/MainGifToPng.png"

    [wallpaper.monitors.eDP-1]
    path = "/home/notkirilov/Pictures/Wallpapers/hyprland-anime-blue-4k.png"

    [[wallpaper.favorite]]
