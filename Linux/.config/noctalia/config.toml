[plugin_settings."fel/quill"]
git_history = false
notes_dir = "/home/notkirilov/obsidian-storage/publish/Quick Notes"

[plugin_settings."noctalia/mpvpaper"]
video_directory = "/home/notkirilov/Pictures/Wallpapers"

[plugin_settings."noctalia/screen_recorder"]
video_source = "region"

[plugin_settings."noctalia/translator"]
provider = "google"
target_lang = "ru"

[plugin_settings."vn1k/cursor"]
hyprland_config = "/home/notkirilov/.config/hypr/cursor-plugin/hyprland.conf"

[plugins]
enabled = [
    "0rgl/ask-claude",
    "felipeartur/ai-usagebar",
    "noctalia/bitwarden",
    "noctalia/screen_recorder",
    "noctalia/mpvpaper",
    "vn1k/cursor",
    "fel/quill",
    "remo/noctes",
    "noctalia/translator",
    "icefish/phone-connect",
    "kenn/keybind-cheatsheet",
    "nilsonlinux/speedtest-meter",
    "thaer99ob/default-apps"
]

[shell]
font_family = "JetBrainsMono NF"

    [shell.launcher.dmenu.entry.panels]
    command = "grep -v '^#' ~/.config/noctalia/panels.tsv | cut -f1,2"
    exec = "~/.config/hypr/scripts/open-panel.sh '{selection}'"
    global = true
    glyph = "layout-sidebar-right"
    label = "Панели"
    prefix = "p"

    [shell.window_switcher]
    mru = true

[theme]
builtin = "Noctalia"
community_palette = "Mizuki-Akiyama"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "vibrant"

    [theme.templates]
    builtin_ids = [ "btop", "cava", "gtk3", "gtk4", "hyprland", "kcolorscheme", "kitty", "qt" ]

[wallpaper.default]
path = "/home/notkirilov/Pictures/Wallpapers/RanchoTwilight_T_Mac.jpg"

[wallpaper.last]
path = "/home/notkirilov/Pictures/Wallpapers/RanchoTwilight_T_Mac.jpg"

[wallpaper.monitors.DP-1]
path = "/home/notkirilov/Pictures/Wallpapers/RanchoTwilight_T_Mac.jpg"

[wallpaper.monitors.DP-7]
path = "/home/notkirilov/Pictures/Wallpapers/RanchoTwilight_T_Mac.jpg"

[wallpaper.monitors.eDP-1]
path = "/home/notkirilov/Pictures/Wallpapers/RanchoTwilight_T_Mac.jpg"

[[wallpaper.favorite]]
palette_source = "wallpaper"
path = "/home/notkirilov/Pictures/Wallpapers/RanchoTwilight_T_Mac.jpg"
theme_mode = "dark"
wallpaper_scheme = "vibrant"

[[wallpaper.favorite]]
palette_source = "wallpaper"
path = "/home/notkirilov/Pictures/Wallpapers/beach-landscape-twilight-sunset.jpg"
theme_mode = "dark"
wallpaper_scheme = "vibrant"

[widget.bar]
type = "felipeartur/ai-usagebar:bar"

[widget.bar_2]
type = "icefish/phone-connect:bar"

[widget.claude-panel]
glyph = "sparkles"
tooltip = "Claude Code (SUPER+A)"
type = "custom_button"

    [widget.claude-panel.actions]
    left = "exec ~/.config/hypr/scripts/claude-panel.sh"

[widget.mpvpaper]
type = "noctalia/mpvpaper:mpvpaper"

[widget.recorder]
type = "noctalia/screen_recorder:recorder"
