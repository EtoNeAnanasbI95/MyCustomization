[bar.default]
center = [ "clock", "bar" ]
end = [
    "claude-panel",
    "tray",
    "notes",
    "recorder",
    "network",
    "volume",
    "battery",
    "control-center",
    "session",
    "notifications"
]
start = [ "launcher", "wallpaper", "mpvpaper", "workspaces", "active_window" ]

[calendar]

[control_center.calendar]
show_events_card = false

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[keybinds]
down = [ "Down", "Ctrl+j", "Ctrl+Cyrillic_o" ]
up = [ "Up", "Ctrl+k", "Ctrl+Cyrillic_el" ]

[location]
address = "Moscow, Russia"

[lockscreen]
transition = [ "golden", "honeycomb", "melt", "pixel", "stripes", "vortex", "wipe", "zoom" ]

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [
    "lockscreen-login-box@DP-6",
    "lockscreen-login-box@eDP-1",
    "lockscreen-widget-0000000000000001",
    "lockscreen-widget-0000000000000002",
    "lockscreen-widget-0000000000000003",
    "lockscreen-widget-0000000000000004",
    "lockscreen-login-box@DP-1"
]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 1280.0
    cy = 1258.0
    output = "DP-1"
    placement_height = 1440.0
    placement_width = 2560.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-6"]
