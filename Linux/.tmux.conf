# Чтоб мышка скрорила терминал
set -g mouse on

# Чтоб vim selection style mode работал
setw -g mode-keys vi

# Новое окно в ной же тиректории
bind c new-window -c "#{pane_current_path}"

# Kill pane

bind -n M-x kill-pane

# Перемещение по pane:
#
# Alt+h
# Alt+j
# Alt+k
# Alt+l

bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Resize pane:
#
# Ctrl+b H
# Ctrl+b J
# Ctrl+b K
# Ctrl+b L

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Pane split:
#
# Alt+v → split вертикально
# Alt+s → split горизонтально

bind -n M-v split-window -h -c "#{pane_current_path}"
bind -n M-s split-window -v -c "#{pane_current_path}"


# ---------- Копирование в стиле vim ----------
# Войти в режим копирования: Alt+y (или по-старому Ctrl+b [). Колёсико мыши вверх тоже входит.
bind -n M-y copy-mode

# Всё скопированное сразу уходит в системный буфер (wl-copy)
set -s copy-command 'wl-copy'
set -g set-clipboard on

# v       - начать выделение с курсора (обычное, посимвольное)
# V       - выделить строку целиком
# Ctrl+v  - прямоугольное выделение (блоком)
# y/Enter - скопировать и выйти
# Esc     - снять выделение, повторный Esc - выйти; q тоже выходит
bind -T copy-mode-vi v      send-keys -X begin-selection
bind -T copy-mode-vi V      send-keys -X select-line
bind -T copy-mode-vi C-v    send-keys -X begin-selection \; send-keys -X rectangle-on
bind -T copy-mode-vi y      send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi Enter  send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi Escape if -F '#{selection_present}' 'send-keys -X clear-selection' 'send-keys -X cancel'

# Выделение мышкой копируется сразу, когда отпускаешь кнопку
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel
